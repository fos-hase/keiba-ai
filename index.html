<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KEIBA AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2346f0d2'/%3E%3Cstop offset='1' stop-color='%238b6cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2305060a'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='url(%23g)' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2305060a'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%2346f0d2' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060a; --bg2:#0a0c14; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --tx:#eef1f8; --tx2:#9aa3b8; --tx3:#5d6579;
  --a1:#46f0d2; --a2:#8b6cff; --hot:#ffcf5a;
  --card:rgba(16,19,30,.62); --glass:rgba(255,255,255,.035);
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:"Inter","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-2;
  background:radial-gradient(40vmax 40vmax at 15% 0%,rgba(70,240,210,.13),transparent 60%),
             radial-gradient(45vmax 45vmax at 100% 20%,rgba(139,108,255,.16),transparent 60%),
             radial-gradient(50vmax 40vmax at 50% 110%,rgba(70,120,255,.10),transparent 60%);
  animation:drift 22s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);opacity:.55}
@keyframes drift{to{transform:translate3d(-3vmax,2vmax,0) scale(1.06)}}

.wrap{max-width:720px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:6px 0 18px;position:sticky;top:0;z-index:5;
  background:linear-gradient(var(--bg) 60%,transparent);backdrop-filter:blur(6px)}
.mark{width:30px;height:30px;border-radius:9px;position:relative;flex:none;
  background:conic-gradient(from 0deg,var(--a1),var(--a2),var(--a1));padding:2px;animation:spin 9s linear infinite}
.mark::after{content:"";position:absolute;inset:2px;border-radius:7px;background:var(--bg)}
.mark i{position:absolute;inset:10px;border-radius:50%;z-index:1;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 0 14px var(--a1)}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand b{font-weight:700;letter-spacing:.22em;font-size:13px}
.brand span{font-family:var(--mono);font-size:11px;color:var(--tx3);letter-spacing:.08em;margin-top:3px}
.sp{flex:1}
.upd{font-family:var(--mono);font-size:11px;color:var(--tx3)}
.refresh{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--glass);color:var(--tx);
  display:grid;place-items:center;cursor:pointer;position:relative;transition:.2s}
.refresh:active{transform:scale(.94)}
.refresh svg{width:19px;height:19px}
.refresh.run{border-color:transparent}
.refresh.run::before{content:"";position:absolute;inset:-2px;border-radius:50%;padding:2px;
  background:conic-gradient(from 0deg,transparent 0 40%,var(--a1),var(--a2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 1s linear infinite}
.refresh.run svg{animation:rot 1.4s linear infinite}
.refresh.ok{box-shadow:0 0 0 1px var(--a1),0 0 18px rgba(70,240,210,.35)}
.refresh.ng{box-shadow:0 0 0 1px #ff5a7a}
@keyframes rot{to{transform:rotate(360deg)}}

.seg{display:flex;gap:6px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--glass);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;min-width:64px;border:0;background:none;color:var(--tx2);font:500 13px var(--sans);padding:9px 10px;border-radius:10px;cursor:pointer;white-space:nowrap}
.seg button.on{color:var(--tx);background:linear-gradient(135deg,rgba(70,240,210,.16),rgba(139,108,255,.18));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}

.race{border:1px solid var(--line);border-radius:18px;background:var(--card);backdrop-filter:blur(14px);margin-bottom:10px;overflow:hidden;transition:border-color .25s}
.race.next{border-color:rgba(70,240,210,.35);box-shadow:0 0 0 1px rgba(70,240,210,.08),0 10px 40px -20px rgba(70,240,210,.45)}
.race.done{opacity:.46}
.head{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:14px 14px 12px;cursor:pointer}
.rno{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:-.02em}
.rno small{display:block;font-size:11px;font-weight:400;color:var(--tx3);margin-top:2px;letter-spacing:.02em}
.rname{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font:500 10.5px var(--mono);color:var(--tx2);border:1px solid var(--line2);border-radius:6px;padding:2px 6px;letter-spacing:.02em}
.tag.g{color:var(--hot);border-color:rgba(255,207,90,.4)}
.tag.v{color:#06120f;background:linear-gradient(135deg,var(--a1),#9ff7e6);border:0;font-weight:600}
.pick{display:flex;align-items:center;gap:9px}
.pick .p{font-family:var(--mono);font-weight:600;font-size:19px;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pick .p small{font-size:11px}
.num{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:600 13px var(--mono);flex:none}
.f1{background:#f5f6fa;color:#111}.f2{background:#16181f;color:#fff;box-shadow:inset 0 0 0 1px #3a3f4c}.f3{background:#e5484d;color:#fff}.f4{background:#3b82f6;color:#fff}
.f5{background:#f5c518;color:#111}.f6{background:#22a35a;color:#fff}.f7{background:#f28c28;color:#111}.f8{background:#f472b6;color:#111}
.strip{height:3px;display:flex;gap:2px;margin:0 14px 12px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.04)}
.strip i{display:block;height:100%}
.body{display:none;padding:2px 10px 12px;border-top:1px solid var(--line)}
.race.open .body{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.legend{display:flex;justify-content:flex-end;gap:14px;padding:10px 6px 4px;font:500 10px var(--mono);color:var(--tx3);letter-spacing:.08em}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.row{display:grid;grid-template-columns:26px 1fr 54px 46px;gap:10px;align-items:center;padding:9px 6px;border-radius:12px}
.row+.row{border-top:1px solid rgba(255,255,255,.035)}
.row.val{background:linear-gradient(90deg,rgba(70,240,210,.09),transparent 70%)}
.hn{min-width:0}
.hn b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hn s{display:block;text-decoration:none;font-size:11px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.06);margin-top:7px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 0 10px rgba(70,240,210,.35)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:rgba(255,255,255,.75)}
.pc{font:600 14px var(--mono);text-align:right}
.pc small{display:block;font-size:10.5px;font-weight:400;color:var(--tx3);margin-top:2px}
.od{font:500 13px var(--mono);text-align:right;color:var(--tx2)}
.od small{display:block;font-size:10.5px;color:var(--tx3);margin-top:2px}
.empty{padding:80px 0;text-align:center;color:var(--tx3);font:500 12px var(--mono);letter-spacing:.2em}
.sheet{position:fixed;inset:0;z-index:20;display:none;place-items:end center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.sheet.on{display:grid}
.sheet form{width:min(720px,100%);padding:20px 16px calc(20px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;display:flex;gap:10px}
.sheet input{flex:1;min-width:0;background:var(--glass);border:1px solid var(--line2);border-radius:12px;color:var(--tx);padding:13px 14px;font:500 15px var(--mono);outline:none}
.sheet input:focus{border-color:var(--a1)}
.sheet button{border:0;border-radius:12px;padding:0 18px;font:600 14px var(--sans);color:#05110f;background:linear-gradient(135deg,var(--a1),#9ff7e6)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"><i></i></div>
    <div class="brand"><b>KEIBA&nbsp;AI</b><span id="date">—</span></div>
    <div class="sp"></div>
    <div class="upd" id="upd"></div>
    <button class="refresh" id="refresh" aria-label="refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
  </header>
  <nav class="seg" id="seg"></nav>
  <main id="list"><div class="empty">LOADING</div></main>
</div>
<div class="sheet" id="sheet"><form id="keyform"><input id="key" type="password" placeholder="KEY" autocomplete="current-password"><button>OK</button></form></div>
<script>
const $=s=>document.querySelector(s);
const S={data:null,api:"",venue:localStorage.getItem("venue")||"ALL",open:new Set(),key:localStorage.getItem("key")||""};
const VEN={"01":"札幌","02":"函館","03":"福島","04":"新潟","05":"東京","06":"中山","07":"中京","08":"京都","09":"阪神","10":"小倉"};
const pct=x=>x==null?"–":(x*100).toFixed(x>=0.1?0:1);
const frame=(n,N)=>{if(!N||N<=8)return Math.min(n,8);const b=Math.floor(N/8),x=N%8;let c=0;for(let f=1;f<=8;f++){c+=b+(f>8-x?1:0);if(n<=c)return f}return 8};
const nowHM=()=>{const d=new Date(Date.now()+(9*60+new Date().getTimezoneOffset())*60000);return d.toTimeString().slice(0,5)};

async function load(){
  try{const c=await fetch("config.json?"+Date.now());if(c.ok)S.api=(await c.json()).api||""}catch(e){}
  let d=null;
  if(S.api&&S.key){try{const r=await fetch(S.api+"/api/predictions",{headers:{"X-Token":S.key}});if(r.ok)d=await r.json()}catch(e){}}
  if(!d){try{const r=await fetch("predictions.json?"+Date.now());if(r.ok)d=await r.json()}catch(e){}}
  S.data=d;render();
}

function render(){
  const d=S.data;
  if(!d||!d.races||!d.races.length){$("#list").innerHTML='<div class="empty">NO DATA</div>';return}
  const dt=d.date||"";$("#date").textContent=dt?`${dt.slice(4,6)}.${dt.slice(6)}`:"";
  $("#upd").textContent=(d.generated||"").slice(11);
  const venues=[...new Set(d.races.map(r=>r.place_code))].sort();
  $("#seg").innerHTML=["ALL",...venues].map(v=>`<button data-v="${v}" class="${S.venue===v?"on":""}">${v==="ALL"?"ALL":VEN[v]||v}</button>`).join("");
  $("#seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.venue=b.dataset.v;localStorage.setItem("venue",S.venue);render()});
  const now=nowHM();
  const races=d.races.filter(r=>S.venue==="ALL"||r.place_code===S.venue);
  const nxt=races.find(r=>r.time>=now);
  $("#list").innerHTML=races.map(r=>card(r,r.time<now,nxt&&r.id===nxt.id)).join("");
  $("#list").querySelectorAll(".head").forEach(h=>h.onclick=()=>{const el=h.parentElement,id=el.dataset.id;
    S.open.has(id)?S.open.delete(id):S.open.add(id);el.classList.toggle("open")});
}

function card(r,done,next){
  const hs=[...r.horses].sort((a,b)=>(b.ai??0)-(a.ai??0));
  const top=hs[0]||{},N=r.n||hs.length;
  const val=new Set((r.bets||[]).filter(b=>b.type==="単勝").map(b=>+b.pick));
  const max=Math.max(...hs.map(h=>Math.max(h.ai||0,h.mkt||0)),0.01);
  const strip=hs.slice(0,6).map((h,i)=>`<i style="flex:${(h.ai||0).toFixed(4)};background:${["#46f0d2","#6fd6ff","#8b6cff","#5d6579","#3d4352","#2c303b"][i]}"></i>`).join("");
  const rows=hs.map(h=>`<div class="row${val.has(h.n)?" val":""}">
      <div class="num f${frame(h.n,N)}">${h.n}</div>
      <div class="hn"><b>${h.name}</b><s>${h.jockey||""}</s>
        <div class="bar"><i style="width:${((h.ai||0)/max*100).toFixed(1)}%"></i>${h.mkt!=null?`<u style="left:${(h.mkt/max*100).toFixed(1)}%"></u>`:""}</div></div>
      <div class="pc">${pct(h.ai)}<small>${pct(h.mkt)}</small></div>
      <div class="od">${h.odds??"–"}<small>${h.pop?h.pop+"番":""}</small></div></div>`).join("");
  const g=r.grade&&!["OP",""].includes(r.grade)?`<span class="tag g">${r.grade}</span>`:"";
  const v=val.size?`<span class="tag v">VALUE</span>`:"";
  return `<section class="race${done?" done":""}${next?" next":""}${S.open.has(r.id)?" open":""}" data-id="${r.id}">
    <div class="head"><div class="rno">${r.no}R<small>${r.time}</small></div>
      <div style="min-width:0"><div class="rname">${r.name}</div>
        <div class="tags"><span class="tag">${VEN[r.place_code]||r.place}</span><span class="tag">${r.surface}${r.distance||""}</span><span class="tag">${N}頭</span>${g}${v}</div></div>
      <div class="pick"><div class="num f${frame(top.n,N)}">${top.n??""}</div><div class="p">${pct(top.ai)}<small>%</small></div></div></div>
    <div class="strip">${strip}</div>
    <div class="body"><div class="legend"><span><i style="background:linear-gradient(90deg,#46f0d2,#8b6cff)"></i>AI</span><span><i style="background:#fff;width:2px;height:9px"></i>ODDS</span></div>${rows}</div>
  </section>`;
}

async function refresh(){
  const b=$("#refresh");
  if(!S.key){$("#sheet").classList.add("on");setTimeout(()=>$("#key").focus(),50);return}
  if(!S.api){b.classList.add("ng");setTimeout(()=>b.classList.remove("ng"),1500);return}
  const one=S.open.size===1?[...S.open][0]:null;
  b.classList.remove("ok","ng");b.classList.add("run");
  try{
    const r=await fetch(S.api+"/api/refresh",{method:"POST",headers:{"X-Token":S.key,"Content-Type":"application/json"},body:JSON.stringify(one?{race_id:one}:{})});
    if(r.status===401){S.key="";localStorage.removeItem("key");throw 0}
    if(!r.ok&&r.status!==409)throw 0;
    for(;;){await new Promise(z=>setTimeout(z,4000));
      const h=await (await fetch(S.api+"/api/health",{headers:{"X-Token":S.key}})).json();
      if(!h.busy){if(h.error)throw 0;break}}
    await load();b.classList.replace("run","ok");setTimeout(()=>b.classList.remove("ok"),2500);
  }catch(e){b.classList.remove("run");b.classList.add("ng");setTimeout(()=>b.classList.remove("ng"),2500)}
}
$("#refresh").onclick=refresh;
$("#keyform").onsubmit=e=>{e.preventDefault();S.key=$("#key").value.trim();if(S.key)localStorage.setItem("key",S.key);$("#sheet").classList.remove("on");load().then(()=>S.key&&refresh())};
$("#sheet").onclick=e=>{if(e.target.id==="sheet")$("#sheet").classList.remove("on")};
load();setInterval(()=>S.data&&render(),60000);
</script>
</body>
</html>
